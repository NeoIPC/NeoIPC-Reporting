name: unit-tests

# Reusable unit + generator test job. Called by build-and-test.yml (push/PR) and by release.yml (before the
# image is pushed) so a released image is never built from a commit whose unit/generator tests fail.
# Excludes container-smoke (Category=Container, needs Docker + a built image) and the shared-seeded-stack
# tests (Category=Integration, workspace-driven).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview
      - name: Restore
        run: dotnet restore tests/NeoIPC.Reporting.Tests/NeoIPC.Reporting.Tests.csproj
      - name: Test (unit + generator)
        run: >
          dotnet test tests/NeoIPC.Reporting.Tests/NeoIPC.Reporting.Tests.csproj
          --no-restore
          --filter "Category!=Integration&Category!=Container"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults/
