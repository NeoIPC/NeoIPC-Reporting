name: release

# Build the service image and publish it to the GitHub Container Registry.
# Triggered on version tags (the release path) and on manual dispatch (for
# out-of-band rebuilds). The image bakes in the report sources and neoipcr
# tracked by each source repo's `current` branch; both are overridable on
# dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reports_branch:
        description: Surveillance-Toolkit branch to bake in
        default: current
        required: false
      neoipcr_branch:
        description: neoipcr branch to bake in
        default: current
        required: false
      extra_tag:
        description: additional image tag to publish (optional)
        default: ''
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/neoipc/neoipc-reporting
          # `latest` moves only on a tagged release; dispatch builds publish
          # `edge` (plus any explicit extra_tag) so a manual rebuild never
          # silently replaces the image the deployment pulls.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/NeoIPC.Reporting/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPORTS_SOURCE=github-branch
            REPORTS_REPO=https://github.com/NeoIPC/Surveillance-Toolkit.git
            REPORTS_BRANCH=${{ inputs.reports_branch || 'current' }}
            NEOIPCR_SOURCE=github-branch
            NEOIPCR_REPO=NeoIPC/neoipcr
            NEOIPCR_BRANCH=${{ inputs.neoipcr_branch || 'current' }}
