services:
  reporting:
    build:
      args:
        BUILD_CONFIGURATION: Debug
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8082:8080"
    cap_add:
      - SYS_PTRACE

  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=neoipc-reporting_frontend
      - --entrypoints.web.address=:80
      - --api.insecure=true
      - --log.level=DEBUG
    ports:
      - "127.0.0.1:8081:8080"
